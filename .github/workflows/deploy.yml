name: Deploy Project

on:
  push:
    branches:
      - exercicio_ajax

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          VITE_GITHUB_TOKEN: ${{secrets.VITE_GITHUB_TOKEN}}
        run: npm run build

      - name: Deploy
        run: echo "Deploying..."
